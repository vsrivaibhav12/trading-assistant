name: backtest
# Re-tests every strategy on history and refreshes the confidence ratings. Runs by itself on the 1st of each month;
# you can also run it by hand. (A starter set of results already ships with the package.)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which to re-test"
        type: choice
        options: [all, swing, intraday, option, rotation]
        default: all
  schedule:
    - cron: "30 1 1 * *"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tassist.backtest ${{ inputs.mode || 'all' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
