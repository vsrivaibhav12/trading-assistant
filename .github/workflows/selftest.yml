name: selftest
# Offline checks, no secrets needed. Runs on every push so a bad edit is caught before it reaches a live tick.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tassist.selftest
